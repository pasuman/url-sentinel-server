spring:
  application:
    name: url-sentinel-server
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

urlsentinel:
  ai:
    base-url: http://localhost:8000
  ssl:
    connect-timeout: 10000
    read-timeout: 10000
  verification:
    enabled: true
    legitimate-threshold: 70
    suspicious-threshold: 20
    checks:
      spki-match:
        enabled: true
        pass-score: 50
        fail-score: -40
      ip-asn-match:
        enabled: true
        pass-score: 20
        fail-score: -20
      ct-log:
        enabled: true
        pass-score: 30
        fail-score: -15
      tls-metadata:
        enabled: true
        pass-score: 10
        fail-score: -10
      chain-validation:
        enabled: true
        pass-score: 10
        fail-score: -10
      multi-region:
        enabled: false
        pass-score: 5
        fail-score: 0
  network-features:
    enabled: true
    dns:
      enabled: true
    ssl:
      enabled: true
    http:
      enabled: true
      connect-timeout: 5000
      read-timeout: 5000
      max-redirects: 10
  rules:
    max-url-length: 200
    special-char-threshold: 8
    max-subdomains: 3
    suspicious-keywords:
      - login
      - verify
      - secure
      - update
      - bank
      - account
      - confirm
      - suspend
      - password
      - signin
      - credential
    shortener-domains:
      - bit.ly
      - tinyurl.com
      - t.co
      - goo.gl
      - ow.ly
      - is.gd
      - buff.ly
      - rebrand.ly
      - bl.ink
    suspicious-tlds:
      - tk
      - ml
      - ga
      - cf
      - gq
      - xyz
      - top
      - club
      - work
      - buzz
      - cam
      - icu
    encoded-char-threshold: 3
  verdict:
    major-count-threshold: 2
    risk-score-threshold: 50
